name: Build World Football Director APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Project Paths & Serialization Imports
        run: |
          mkdir -p app/src/main/java/com/worldfootball/director/model
          mkdir -p app/src/main/java/com/worldfootball/director/data
          mkdir -p app/src/main/java/com/worldfootball/director/engine
          mkdir -p app/src/main/java/com/worldfootball/director/ui
          mkdir -p app/src/test/java/com/worldfootball/director
          find app -name "*WorldModels*.kt" -exec sh -c '
            for f do
              if [ "$f" != "app/src/main/java/com/worldfootball/director/model/WorldModels.kt" ]; then
                mv "$f" app/src/main/java/com/worldfootball/director/model/WorldModels.kt
              fi
            done
          ' sh {} +
          for f in $(find app -name "*.kt"); do
            if grep -q "decodeFromString" "$f" && ! grep -q "import kotlinx.serialization.decodeFromString" "$f"; then
              sed -i 's/import kotlinx.serialization.encodeToString/import kotlinx.serialization.encodeToString\nimport kotlinx.serialization.decodeFromString/g' "$f"
            fi
          done

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Automated Engine Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldFootballDirector-APK
          path: app/build/outputs/apk/debug/app-debug.apk
